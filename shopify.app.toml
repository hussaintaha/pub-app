# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3e732424b9fcd2551d29739a530aa0dc"
name = "cartia"
handle = "cartia"
application_url = "https://forge-maldives-distinct-berkeley.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_themes"

[auth]
redirect_urls = [
  "https://forge-maldives-distinct-berkeley.trycloudflare.com/auth/callback",
  "https://forge-maldives-distinct-berkeley.trycloudflare.com/auth/shopify/callback",
  "https://forge-maldives-distinct-berkeley.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false

[app_proxy]
url = "https://forge-maldives-distinct-berkeley.trycloudflare.com"
subpath = "public"
prefix = "apps"
